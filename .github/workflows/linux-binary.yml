name: Python wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Same system family as the Render Python service, so the module loads there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Python module
        run: |
          pip install maturin
          maturin build --release --interpreter python3.12
          cp target/wheels/pdfcalque-*.whl pdfcalque-cp312.whl
      - name: Publish the wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view python || gh release create python --title "Python package" --notes "import pdfcalque"
          gh release upload python pdfcalque-cp312.whl --clobber
