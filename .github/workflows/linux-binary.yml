name: Linux binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Render's Python image is older than ubuntu-latest. A binary from
    # the newest image needs a glibc the server does not have, so it
    # never starts and the converter falls back to Poppler.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pdfcalque
        run: cargo build --release --bin pdfcalque
      - name: Publish the Linux program
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view linux || gh release create linux --title "Linux binary" --notes "Program used by the PDF converter."
          gh release upload linux target/release/pdfcalque --clobber
