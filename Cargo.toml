[package]
name = "pdfcalque"
version = "0.1.0"
edition = "2021"
description = "Parse a PDF into document structures that can be written as HTML"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
fax = "0.3.0"
flate2 = "1"
lopdf = "0.36"
pyo3 = { version = "0.23", features = ["extension-module"] }
stet-fonts = "0.10"
rust_xlsxwriter = "0.102.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
